name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - run: make test-integration
      - run: make build
      - run: docker build -t go-starter-kit:ci .
      - run: docker build --target worker -t go-starter-kit-worker:ci .
